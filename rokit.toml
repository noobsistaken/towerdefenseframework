# Pinned toolchain. Every tool here is resolved to an exact published release.
# Bump deliberately, never opportunistically: a tool version change is a
# change to the verification layer, and the verification layer is the only
# thing catching bad code before it ships.
#
# Install everything with:  rokit install
# Versions resolved 2026-08-13 (see SETUP-LOG.md).

